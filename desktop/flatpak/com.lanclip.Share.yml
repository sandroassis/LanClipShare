app-id: com.lanclip.Share
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: lanclip-share
finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=fallback-x11
  - --filesystem=xdg-download

modules:
  - name: lanclip-share
    buildsystem: simple
    build-commands:
      - install -Dm755 src/lanclip_desktop.py /app/share/lanclip-share/lanclip_desktop.py
      - install -Dm755 flatpak/lanclip-share.sh /app/bin/lanclip-share
      - install -Dm644 flatpak/com.lanclip.Share.desktop /app/share/applications/com.lanclip.Share.desktop
      - install -Dm644 flatpak/com.lanclip.Share.metainfo.xml /app/share/metainfo/com.lanclip.Share.metainfo.xml
      - install -Dm644 ../LanClipShare/ic_launcher_512.png /app/share/icons/hicolor/512x512/apps/com.lanclip.Share.png
    sources:
      - type: dir
        path: ..
